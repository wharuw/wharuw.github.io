backend:
  name: git-gateway
  branch: main

# 로그인한 사람이 저장(Publish)하면 바로 반영됩니다 (별도 승인 절차 없음)
publish_mode: simple

media_folder: "images/uploads"
public_folder: "images/uploads"

locale: "ko"

collections:
  - name: "site"
    label: "사이트 설정"
    files:
      - name: "settings"
        label: "전체 설정"
        file: "content/site.json"
        fields:
          - label: "색상 테마"
            name: "theme"
            widget: "object"
            summary: "색상 6종"
            fields:
              - { label: "배경색", name: "bg", widget: "color" }
              - { label: "진한 배경색 (하단 문의 섹션)", name: "bgDeep", widget: "color" }
              - { label: "기본 글자색", name: "text", widget: "color" }
              - { label: "보조 글자색 (연한 회색톤 글씨)", name: "textSoft", widget: "color" }
              - { label: "포인트색 1 (우드톤)", name: "wood", widget: "color" }
              - { label: "포인트색 2 (테라코타)", name: "terracotta", widget: "color" }
              - { label: "구분선 색", name: "line", widget: "color" }

          - label: "폰트 & 글자 크기"
            name: "font"
            widget: "object"
            summary: "{{fields.heading}} / {{fields.body}}"
            fields:
              - label: "제목용 폰트 (로고, 큰 타이틀)"
                name: "heading"
                widget: "select"
                options: ["Cormorant", "Playfair Display", "Noto Serif KR"]
              - label: "본문용 폰트"
                name: "body"
                widget: "select"
                options: ["Pretendard Variable", "Inter", "Noto Sans KR"]
              - label: "전체 글자 크기"
                name: "scale"
                widget: "select"
                options:
                  - { label: "작게", value: "0.9" }
                  - { label: "기본", value: "1" }
                  - { label: "크게", value: "1.1" }

          - label: "메인 화면 (히어로)"
            name: "hero"
            widget: "object"
            summary: "{{fields.title}}"
            fields:
              - { label: "작은 소개 문구", name: "eyebrow", widget: "string" }
              - { label: "메인 타이틀 (줄바꿈은 Enter로)", name: "title", widget: "text" }
              - { label: "서브 문구", name: "sub", widget: "text" }
              - { label: "배경 이미지", name: "image", widget: "image" }

          - label: "소개 (About)"
            name: "about"
            widget: "object"
            summary: "{{fields.title}}"
            fields:
              - { label: "소제목", name: "title", widget: "string" }
              - { label: "본문 문단 1", name: "paragraph1", widget: "text" }
              - { label: "본문 문단 2", name: "paragraph2", widget: "text" }
              - { label: "프로필/스튜디오 사진", name: "photo", widget: "image" }

          - label: "서비스 목록"
            name: "services"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "서비스명", name: "name", widget: "string" }
              - { label: "설명", name: "desc", widget: "text" }

          - label: "포트폴리오"
            name: "portfolio"
            widget: "list"
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - { label: "작업명", name: "title", widget: "string" }
              - { label: "카테고리", name: "category", widget: "string" }
              - { label: "이미지", name: "image", widget: "image" }
              - { label: "링크 (선택, 없으면 비워두세요)", name: "link", widget: "string", required: false }

          - label: "연락처"
            name: "contact"
            widget: "object"
            fields:
              - { label: "문의 받을 이메일", name: "email", widget: "string" }
